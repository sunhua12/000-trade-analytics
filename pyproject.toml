[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-analytics"
version = "0.1.0"
description = "U.S. semiconductor import analytics pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.35,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "tenacity>=9,<10",
]

[project.optional-dependencies]
warehouse = ["google-cloud-bigquery==3.45.2"]
dashboard = ["google-cloud-bigquery==3.45.2", "streamlit==1.64.0", "pandas>=2.2,<3"]
dev = [
    "boto3-stubs[s3]>=1.35,<2",
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "respx>=0.21,<1",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = [".", "src"]
markers = [
    "integration: calls live external services and requires --run-integration",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Personal dictionary conversion files are unrelated to this project's tests.
extend-exclude = ["tests/TEST"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["trade_analytics"]
mypy_path = "src"
