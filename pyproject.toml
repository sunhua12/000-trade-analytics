[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-analytics"
version = "0.1.0"
description = "U.S. semiconductor import analytics pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "respx>=0.21,<1",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["trade_analytics"]
mypy_path = "src"
