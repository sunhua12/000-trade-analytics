version: 2
unit_tests:
- name: calendar_growth_and_unit_value
  model: int_partner_market_share
  given:
  - input: ref('fct_monthly_semiconductor_imports')
    rows:
    - cmd_code: '8542'
      hs_version: H6
      period_start_date: '2023-01-01'
      partner_code: '1'
      primary_value: 50
      net_weight: 10
      partner_type: country
      classification_status: verified
    - cmd_code: '8542'
      hs_version: H6
      period_start_date: '2023-02-01'
      partner_code: '1'
      primary_value: 100
      net_weight: 0
      partner_type: country
      classification_status: verified
    - cmd_code: '8542'
      hs_version: H6
      period_start_date: '2024-01-01'
      partner_code: '1'
      primary_value: 75
      net_weight: null
      partner_type: country
      classification_status: verified
  - input: ref('stg_un_comtrade__world_totals')
    rows:
    - period_start_date: '2023-01-01'
      cmd_code: '8542'
      hs_version: H6
      primary_value: 100
    - period_start_date: '2023-02-01'
      cmd_code: '8542'
      hs_version: H6
      primary_value: 200
    - period_start_date: '2024-01-01'
      cmd_code: '8542'
      hs_version: H6
      primary_value: 100
  expect:
    rows:
    - period_start_date: '2023-01-01'
      partner_code: '1'
      hs_version: H6
      market_share: 0.5
      mom: null
      yoy: null
      unit_value_usd_per_kg: 5
      market_share_status: ok
    - period_start_date: '2023-02-01'
      partner_code: '1'
      hs_version: H6
      market_share: 0.5
      mom: 1
      yoy: null
      unit_value_usd_per_kg: null
      market_share_status: ok
    - period_start_date: '2024-01-01'
      partner_code: '1'
      hs_version: H6
      market_share: 0.75
      mom: null
      yoy: 0.5
      unit_value_usd_per_kg: null
      market_share_status: ok
- name: country_concentration
  model: int_market_concentration_hhi
  given:
  - input: ref('int_partner_market_share')
    rows:
    - cmd_code: '8542'
      hs_version: H6
      period_start_date: '2023-01-01'
      partner_type: country
      classification_status: verified
      primary_value: 60
      market_share: '0.6'
    - cmd_code: '8542'
      hs_version: H6
      period_start_date: '2023-01-01'
      partner_type: country
      classification_status: verified
      primary_value: 40
      market_share: '0.4'
  - input: ref('stg_un_comtrade__world_totals')
    rows:
    - period_start_date: '2023-01-01'
      cmd_code: '8542'
      hs_version: H6
      primary_value: 100
  expect:
    rows:
    - cmd_code: '8542'
      hs_version: H6
      period_start_date: '2023-01-01'
      country_coverage: 1
      hhi_raw: 5200
      hhi: 5200
      hhi_status: ok
