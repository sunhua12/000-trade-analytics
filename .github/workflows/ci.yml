name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev,warehouse]'
      - run: bash scripts/ci_checks.sh
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test frontend/tests/*.test.mjs
      - run: node frontend/build.mjs
  dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: >-
          docker run --rm -v "$PWD:/opt/trade-analytics:ro"
          -e AIRFLOW__CORE__LOAD_EXAMPLES=False
          -e PYTHONPATH=/opt/trade-analytics/dags
          apache/airflow:3.3.2-python3.11
          python /opt/trade-analytics/scripts/check_dags.py /opt/trade-analytics/dags
