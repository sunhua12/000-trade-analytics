name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,warehouse,dashboard]'
      - run: bash scripts/ci_checks.sh
  dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: >-
          docker run --rm -v "$PWD:/opt/trade-analytics:ro"
          -e AIRFLOW__CORE__LOAD_EXAMPLES=False
          apache/airflow:3.3.2-python3.11
          python /opt/trade-analytics/scripts/check_dags.py /opt/trade-analytics/dags
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker buildx build --platform linux/amd64 --provenance=false --load -t trade-ci .
      - name: Handler import smoke without cloud credentials
        run: >-
          docker run --rm --platform linux/amd64 --entrypoint python trade-ci
          -c "from trade_analytics.lambda_handler import handler; from pydantic import ValidationError;
          exec('try:\n handler({\"action\": \"unsupported\"}, None)\nexcept ValidationError:\n print(\"handler validation passed\")\nelse:\n raise SystemExit(\"invalid event was accepted\")')"
  dashboard-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --platform linux/amd64 --provenance=false -f Dockerfile.dashboard -t trade-dashboard-ci .
      - run: bash scripts/check_dashboard_container.sh trade-dashboard-ci
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [bootstrap, application]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.2'
          terraform_wrapper: false
      - run: terraform -chdir=infrastructure/aws/${{ matrix.root }} fmt -check
      - run: terraform -chdir=infrastructure/aws/${{ matrix.root }} init -backend=false -lockfile=readonly
      - run: terraform -chdir=infrastructure/aws/${{ matrix.root }} validate
