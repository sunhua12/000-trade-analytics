name: GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Reuse the accepted public snapshot, never the legacy sample in main.
      # Update this SHA through a reviewed PR when a new snapshot is accepted.
      - name: Checkout accepted public data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1f73c41d00e679ae20b2c964b5d7f22e0e65d12a
          path: accepted-snapshot
          sparse-checkout: data
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage verified production snapshot
        run: cp accepted-snapshot/data/{manifest,monthly,partners}.json frontend/public/data/
      - run: node --test frontend/tests/*.test.mjs
      - name: Build and verify checksums
        run: node frontend/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
